##docker-compose.yml para que MariaDB y Joomla con IP estáticas

networks:
  joomla_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24

services:
  db:
    image: mariadb:noble
    container_name: joomla_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: org
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomlauser
      MYSQL_PASSWORD: org
    volumes:
      - db_data:/var/lib/mysql
    networks:
      joomla_net:
        ipv4_address: 192.168.1.100

  joomla:
    image: joomla:php8.3-apache
    container_name: joomla_app
    restart: always
    depends_on:
      - joomla_db
    ports:
      - "8080:80"
    environment:
      JOOMLA_DB_HOST: joomla_db
      JOOMLA_DB_NAME: joomla
      JOOMLA_DB_USER: joomlauser
      JOOMLA_DB_PASSWORD: org
    volumes:
      - joomla_data:/var/www/html
    networks:
      joomla_net:
        ipv4_address: 192.168.1.101

volumes:
  db_data:
  joomla_data:
