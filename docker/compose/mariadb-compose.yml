
services:
  database:
    image: mariadb:lts
    container_name: unidad4_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: org
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: prestashop
      MARIADB_USER_HOST: "%"
      MARIADB_USER: prestashop
      MARIADB_PASSWORD: org
    volumes:
      - db_data:/var/lib/mysql