version: '3'
services:
  prediction-app:
    image: python:3.8
    volumes:
      - ./datos.csv:/app/datos.csv
      - ./valoresapredecir:/app/valoresapredecir
      - ./linear_regression.py:/app/linear_regression.py
      - ./requirements.txt:/app/requirements.txt
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python linear_regression.py"
    stdin_open: true
    tty: true
