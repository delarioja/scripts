network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s3:
      dhcp4: true
    enp0s8:
      addresses:
        - 192.168.1.100/24
      nameservers:
      #  search: [mydomain, otherdomain]
        addresses: [8.8.4.4, 1.1.1.1]
      routes:
        - to: 192.168.2.0/24
          via: 192.168.1.1